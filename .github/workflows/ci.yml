name: MCO-1D CI Engineering Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verification:
    name: Build & Engineering Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y prusa-slicer || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest reportlab

      - name: 1. Repository Hygiene & Markdown Link Doctor
        run: |
          python3 scripts/mco_cli.py doctor

      - name: 2. Automated Test Suite (1,020 Tests)
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: 3. 50 Hz Hardware-in-the-Loop SITL Simulation
        run: |
          python3 firmware/mco_main.py --sim --duration 2

      - name: 4. TC-01 Rigid Bench Qualification
        run: |
          python3 scripts/run_tc01_bench_checkout.py

      - name: 5. Bill of Materials & Mass Budget Verification
        run: |
          python3 scripts/mco_bom_tool.py --verify
